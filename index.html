<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ryuu 龍 | Premium</title>
    <link rel="icon" type="image/jpeg" href="./assets/favicon.jpg">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header>
        <div class="brand" id="brand-logo">
            <img src="./assets/favicon.jpg" alt="Ryuu Logo" onerror="this.src='https://via.placeholder.com/38/000/fff?text=龍'">
            <h1>Ryuu <span>龍</span></h1>
        </div>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search anime...">
        </div>
    </header>

    <main>
        <div class="hero-container" id="hero-carousel">
            <div id="hero-track"></div>
            <div class="hero-dots" id="hero-dots"></div>
        </div>

        <div id="browse-view">
            <div class="section-header">
                <h2 class="section-title" id="grid-header-title">Trending Now</h2>
            </div>
            <div class="anime-grid" id="anime-grid">
                <div class="state-msg">Loading premium library...</div>
            </div>
        </div>

        <div id="detail-view">
            <button class="btn-back" id="btn-back">← Back to Browse</button>
            <div class="detail-card">
                <img id="detail-img" class="detail-poster" src="" alt="Cover">
                <div class="detail-body">
                    <h2 id="detail-title"></h2>
                    <p id="detail-desc"></p>
                    <div class="episodes-title">Episodes</div>
                    <div class="episodes-grid" id="episodes-grid"></div>
                </div>
            </div>

            <div class="player-wrapper">
                <h3 id="player-status-label">Select an episode to begin</h3>
                <iframe id="video-frame" src="" allowfullscreen></iframe>
            </div>
        </div>
    </main>
</body>
</html>
