<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ryuu 龍 | Premium</title>
    <meta name="description" content="Ryuu 龍 — Premium anime streaming experience">

    <!-- Standard Favicons -->
    <link rel="icon" type="image/x-icon" href="./favicons/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="./favicons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicons/favicon-32x32.png">

    <link rel="icon" type="image/png" sizes="96x96" href="./favicons/favicon-96x96.png">

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="./favicons/apple-touch-icon-180x180.png">
    <link rel="apple-touch-icon" sizes="57x57" href="./favicons/apple-touch-icon-57x57.png">
    <link rel="apple-touch-icon" sizes="60x60" href="./favicons/apple-touch-icon-60x60.png">
    <link rel="apple-touch-icon" sizes="68x68" href="./favicons/apple-touch-icon-68x68.png">
    <link rel="apple-touch-icon" sizes="72x72" href="./favicons/apple-touch-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="76x76" href="./favicons/apple-touch-icon-76x76.png">
    <link rel="apple-touch-icon" sizes="114x114" href="./favicons/apple-touch-icon-114x114.png">
    <link rel="apple-touch-icon" sizes="120x120" href="./favicons/apple-touch-icon-120x120.png">
    <link rel="apple-touch-icon" sizes="144x144" href="./favicons/apple-touch-icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="./favicons/apple-touch-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="167x167" href="./favicons/apple-touch-icon-167x167.png">

    <!-- Android / PWA Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="./favicons/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="./favicons/android-chrome-512x512.png">

    <!-- PWA Manifest -->
    <link rel="manifest" href="./site.webmanifest">
    <meta name="theme-color" content="#000000">
    <meta name="background-color" content="#f5f5f7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ryuu">
    <meta name="application-name" content="Ryuu">

    <!-- Microsoft Tiles -->
    <meta name="msapplication-TileImage" content="./favicons/mstile-150x150.png">
    <meta name="msapplication-TileColor" content="#000000">
    <meta name="msapplication-config" content="./browserconfig.xml">

    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header>
        <div class="brand" id="brand-logo">
            <img src="./favicons/android-chrome-192x192.png" alt="Ryuu Logo" onerror="this.src='https://via.placeholder.com/38/000/fff?text=龍'">
            <h1>Ryuu <span>龍</span></h1>
        </div>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search anime...">
        </div>
        <button class="btn-install" id="btn-install" hidden>Install App</button>
    </header>

    <main>
        <div class="hero-container" id="hero-carousel">
            <div id="hero-track"></div>
            <div class="hero-dots" id="hero-dots"></div>
        </div>

        <div id="browse-view">
            <div class="section-header">
                <h2 class="section-title" id="grid-header-title">Trending Now</h2>
            </div>
            <div class="anime-grid" id="anime-grid">
                <div class="state-msg">Loading premium library...</div>
            </div>
        </div>

        <div id="detail-view">
            <button class="btn-back" id="btn-back">← Back to Browse</button>
            <div class="detail-card">
                <img id="detail-img" class="detail-poster" src="" alt="Cover">
                <div class="detail-body">
                    <h2 id="detail-title"></h2>
                    <p id="detail-desc"></p>
                    <div class="episodes-title">Episodes</div>
                    <div class="episodes-grid" id="episodes-grid"></div>
                </div>
            </div>

            <div class="player-wrapper">
                <h3 id="player-status-label">Select an episode to begin</h3>
                <iframe id="video-frame" src="" allowfullscreen></iframe>
            </div>
        </div>
    </main>
</body>
</html>
